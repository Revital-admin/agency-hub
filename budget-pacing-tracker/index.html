<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retainer / Budget Pacing Tracker</title>
  <link rel="stylesheet" href="../style.css?v=3">
  <link rel="stylesheet" href="css/style.css?v=5">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-grid"></div>

  <main class="container">
    <div class="brand-bar">
      <div class="brand-logo-container"></div>
    </div>

    <div style="display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:16px;">
      <header class="site-header" style="margin-bottom:0;">
        <div class="header-eyebrow"><span class="dot"></span><span>Spend Tracking</span></div>
        <h1 class="site-title">Budget <em>Pacing</em></h1>
        <p class="site-subtitle">Track client ad spend and retainer hours against their monthly caps.</p>
      </header>
      <button class="btn-primary" id="addTrackerBtn">+ Track New Client</button>
    </div>

    <div class="top-controls">
      <div class="form-group" style="margin-bottom:0">
        <select id="newClientSelect" style="width: 250px;">
          <!-- Populated via JS -->
        </select>
      </div>
    </div>

    <div class="tracker-list" id="trackerList">
      <!-- Pacing cards will be rendered here -->
    </div>

    <div class="step-card empty-state" id="emptyState" style="display:none; margin-top:24px;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <h3>No Budgets Tracked</h3>
      <p>Select a client from the dropdown above to start tracking their budget pacing.</p>
    </div>
  </main>
  <script src="../shared-number-format.js?v=1"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
