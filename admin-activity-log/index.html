<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Log</title>
  <link rel="stylesheet" href="../style.css?v=3">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-grid"></div>

  <main class="container">
    <div class="brand-bar">
      <div class="brand-logo-container"></div>
    </div>

    <header class="site-header">
      <div class="header-eyebrow"><span class="dot"></span><span>Core Operations</span></div>
      <h1 class="site-title">Activity <em>Log</em></h1>
      <p class="site-subtitle">A running record of who did what and when across the Hub — client created/deleted, approvals sent, engagement stage changes. Read-only; nothing here can be edited or deleted.</p>
    </header>

    <div class="step-card" style="margin-top: 24px;">
      <div class="form-row">
        <div class="form-group" style="flex: 2;">
          <input type="text" id="activityLogSearchInput" class="form-control" placeholder="Search by action, client, or teammate...">
        </div>
      </div>
    </div>

    <div class="step-card" style="margin-top: 16px; padding: 0;">
      <div id="activityLogList" class="activity-log-list"></div>
      <p id="activityLogEmpty" class="empty-state" style="display:none;">No activity logged yet.</p>
    </div>
  </main>
  <script src="js/app.js?v=2"></script>
</body>
</html>
