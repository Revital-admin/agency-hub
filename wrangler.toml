# wrangler.toml
name = 'agency-hub'
compatibility_date = "2024-03-20"
main = "_worker.js"

[assets]
directory = "."
binding = "ASSETS"

# Backs the Contract Template Library's upload/replace feature in the
# Contract & Invoice Tracker (POST/GET/DELETE /api/contracts/* in
# _worker.js) - stores uploaded contract PDFs so they can be added or
# swapped from the Hub UI without a code change + redeploy. The 6
# original contract templates stay as static files under /contracts/
# (edited by replacing the file + redeploying, same as before); this
# bucket is only for templates added/replaced through the new UI.
#
# One-time manual step required before this binding will resolve: create
# the bucket with `wrangler r2 bucket create revital-contracts` (or via
# the Cloudflare dashboard -> R2 -> Create bucket, same name) - deploy
# will fail with a "bucket does not exist" error until that's done once.
[[r2_buckets]]
binding = "CONTRACTS_BUCKET"
bucket_name = "revital-contracts"

# Backup target for CONTRACTS_BUCKET, since R2 has no built-in object
# versioning (see the Data Backup & Disaster Recovery SOP in SOP Wiki).
# handleContractDelete in _worker.js copies a file into this bucket right
# before permanently deleting it from CONTRACTS_BUCKET, so an accidental
# delete (a direct Delete click, or the delete-old-file step of a Replace)
# is always recoverable - nothing in the primary bucket is ever removed
# without a copy landing here first.
#
# This binding is optional at runtime - if it's missing or the bucket
# doesn't exist yet, deletes still work exactly as before (no backup, no
# error). Same one-time manual step as CONTRACTS_BUCKET before it takes
# effect: `wrangler r2 bucket create revital-contracts-backup` (or via the
# Cloudflare dashboard -> R2 -> Create bucket, same name).
[[r2_buckets]]
binding = "CONTRACTS_BACKUP_BUCKET"
bucket_name = "revital-contracts-backup"

# Weekly Agency Health Digest - runs runWeeklyHealthDigest() in _worker.js
# on a schedule with no request/user involved, emailing the same
# needs-attention list Agency Health Dashboard shows live in the Hub.
# Cron Triggers deploy automatically with this Worker on the next push;
# verify it under Cloudflare dashboard -> Workers & Pages -> this Worker ->
# Triggers -> Cron Triggers afterward.
#
# "0 13 * * 1" = every Monday at 13:00 UTC (~8-9am US Eastern depending on
# DST). Cron Triggers always run in UTC - adjust the hour here if the team
# is elsewhere or wants a different day/time. Cron syntax: minute hour
# day-of-month month day-of-week (1 = Monday).
#
# Requires two secrets already set for other features in this file:
#   FIREBASE_SERVICE_ACCOUNT_KEY (same one /api/mint-firebase-token uses)
#   RESEND_API_KEY (same one /api/send-email uses)
# Plus one optional new one - comma-separated recipient list, defaults to
# admin@revitalproductions.com if unset:
#   wrangler secret put HEALTH_DIGEST_RECIPIENTS
[triggers]
crons = ["0 13 * * 1"]
