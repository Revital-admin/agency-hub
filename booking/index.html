<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book a Discovery Call — Revital Productions</title>
<meta name="robots" content="noindex" />
<!--
  Standalone public page - deliberately NOT part of the internal Hub's
  SPA/nav/iframe system (see root index.html/app.js). This is meant to be
  reached directly at book.revitalproductions.com, a subdomain outside
  the Cloudflare Access application that protects the rest of the Hub, so
  it has to work for anonymous prospects with no login at all. Talks to
  /api/booking/roster, /api/booking/availability, /api/booking/book in
  _worker.js. Self-contained (styles/script inline) rather than pulling
  in the Hub's shared CSS stack, since those files assume they're loaded
  inside the Access-protected app shell.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Same headline font the live revitalproductions.com site uses
     (pulled from its own stylesheet's @font-face rule) - self-hosted at
     Framer's CDN, referenced directly here so the booking page's
     headline matches the marketing site exactly rather than
     approximating it with a lookalike. */
  @font-face {
    font-family: "Azo Sans Uber Regular";
    src: url("https://framerusercontent.com/assets/61LYSu5ltMaZcADwTMqTvGekik.woff2") format("woff2");
    font-display: swap;
    font-style: normal;
    font-weight: 400;
  }
  :root {
    /* Colors pulled directly from revitalproductions.com's computed
       styles (getComputedStyle against the live site), not guessed. */
    --primary: #f5805f;
    --secondary: #d85a30;
    --bg-main: #262626;
    --bg-card: #303030;
    --border-color: rgba(241, 234, 219, 0.12);
    --text-bright: #f1eadb;
    --text-muted: rgba(241, 234, 219, 0.55);
    --font-heading: "Azo Sans Uber Regular", "Inter", sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-main);
    color: var(--text-bright);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .page {
    width: 100%;
    max-width: 640px;
  }
  .brand-logo { height: 28px; margin-bottom: 20px; display: block; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(245, 128, 95, 0.08);
    border: 1px solid rgba(245, 128, 95, 0.2);
    border-radius: 100px;
    padding: 4px 12px;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--primary);
    margin-bottom: 16px;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 6px var(--primary); }
  h1 {
    font-family: var(--font-heading);
    font-weight: 400;
    font-size: 2.4rem;
    line-height: 1.15;
    margin: 0 0 10px 0;
  }
  .subtitle { color: var(--text-muted); margin: 0 0 32px 0; font-size: 1rem; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { font-family: var(--font-heading); font-size: 1.1rem; margin: 0 0 16px 0; font-weight: 600; }
  .person-list, .day-list { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill-btn {
    background: rgba(245, 241, 232, 0.04);
    border: 1px solid var(--border-color);
    color: var(--text-bright);
    border-radius: 10px;
    padding: 10px 16px;
    font-family: var(--font-body);
    font-size: 0.9rem;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    text-align: left;
  }
  .pill-btn:hover { border-color: var(--primary); }
  .pill-btn.selected { border-color: var(--primary); background: rgba(245, 128, 95,0.12); }
  .pill-btn .pill-sub { display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }
  .slot-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; margin-top: 16px; }
  .slot-btn {
    background: rgba(245, 241, 232, 0.04);
    border: 1px solid var(--border-color);
    color: var(--text-bright);
    border-radius: 8px;
    padding: 10px 8px;
    font-family: var(--font-body);
    font-size: 0.85rem;
    cursor: pointer;
    text-align: center;
  }
  .slot-btn:hover { border-color: var(--primary); background: rgba(245, 128, 95,0.12); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
  .form-group input, .form-group textarea {
    width: 100%;
    background: var(--bg-main);
    border: 1px solid var(--border-color);
    color: var(--text-bright);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 0.95rem;
  }
  .form-group textarea { min-height: 70px; resize: vertical; }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: #1a1408;
    border: none;
    border-radius: 10px;
    padding: 12px 22px;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .btn-primary:disabled { opacity: 0.6; cursor: default; }
  .btn-text {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
    margin-bottom: 16px;
  }
  .selected-slot-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(245, 128, 95,0.08);
    border: 1px solid rgba(245, 128, 95,0.25);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    font-size: 0.9rem;
  }
  .msg { font-size: 0.9rem; margin-top: 12px; }
  .msg.error { color: #f87171; }
  .msg.muted { color: var(--text-muted); }
  .hidden { display: none !important; }
  .confirm-card { text-align: center; padding: 40px 24px; }
  .confirm-card .check {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(74, 222, 128, 0.12); color: #4ade80;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px auto; font-size: 26px;
  }
</style>
</head>
<body>
<div class="page">
  <img class="brand-logo" src="https://framerusercontent.com/images/o3h6eIm6ccc2IJyWsP0aAbTp5M.png" alt="Revital Productions" />
  <div class="eyebrow"><span class="dot"></span>REVITAL PRODUCTIONS</div>
  <h1 id="pageTitle">Book a 15-Minute Discovery Call</h1>
  <p class="subtitle" id="pageSubtitle">Book a quick discovery or send us a note — we reply within one business day. We'll send a calendar invite with the video link right away.</p>

  <!-- Contact info step - now shown FIRST (Aug 2026), not after time
       selection, because who gets assigned depends on what's typed in
       Description (see the auto-routing note in js/app.js). Skipped
       entirely (never shown) when arriving prefilled from the
       revitalproductions.com contact form (see isPrefilled in the script)
       - those visitors go straight to resolving who they're assigned to. -->
  <div id="formStep" class="card hidden">
    <h2>A couple quick details</h2>

    <div id="contactFields">
      <div class="form-group">
        <label for="fName">Name</label>
        <input type="text" id="fName" placeholder="Jane Smith" />
      </div>
      <div class="form-group">
        <label for="fEmail">Email</label>
        <input type="email" id="fEmail" placeholder="jane@company.com" />
      </div>
      <div class="form-group">
        <label for="fCompany">Company name</label>
        <input type="text" id="fCompany" placeholder="Company name" />
      </div>
      <div class="form-group">
        <label for="fNotes">Description</label>
        <textarea id="fNotes" placeholder="Tell us a bit about your project or what you're hoping to get out of the call"></textarea>
      </div>
    </div>

    <button class="btn-primary" id="continueBtn">CONTINUE</button>
    <p id="formMsg" class="msg error hidden"></p>
  </div>

  <!-- Time step - no more "who would you like to talk to" picker. Who
       it's with is decided automatically (specialist keyword match in
       Description, else round robin - see js/app.js) and announced in
       #assignmentBanner once availability loads, rather than asked of the
       prospect up front. -->
  <div id="timeStep" class="card hidden">
    <button class="btn-text" id="backToFormBtn">&larr; Back</button>
    <div id="assignmentBanner" class="selected-slot-banner hidden"></div>
    <h2>Pick a day and time</h2>
    <div id="dayList" class="day-list"></div>
    <div id="slotList" class="slot-list"></div>
    <p id="timeMsg" class="msg muted"></p>

    <div id="slotConfirmRow" class="hidden" style="margin-top:16px;">
      <div id="selectedSlotBanner" class="selected-slot-banner"></div>
      <button class="btn-primary" id="confirmBtn">BOOK 15 MIN CALL</button>
      <p id="confirmMsg" class="msg error hidden"></p>
    </div>
  </div>

  <div id="confirmStep" class="card confirm-card hidden">
    <div class="check">&#10003;</div>
    <h2>You're booked!</h2>
    <p class="subtitle" id="confirmText"></p>
  </div>

  <div id="loadMsg" class="msg muted">Loading...</div>
</div>

<script>
(function () {
  const el = (id) => document.getElementById(id);
  // assignedPerson: { id, amEmail, name, title } - resolved AFTER contact
  // info is submitted (Aug 2026), not chosen by the prospect anymore. id
  // is set for auto-routed/direct-personId bookings, amEmail for
  // client-portal bookings; whichever one is set is what gets sent back
  // to /api/booking/book.
  let assignedPerson = null;
  let availability = null; // { timezone, slotMinutes, slotsByDay }
  let selectedDay = null;
  let selectedSlotISO = null;
  let contact = { name: "", email: "", company: "", notes: "" };
  // True only when assignedPerson came from notes-based auto-routing
  // (not a direct ?personId= link, not ?amEmail=) - controls whether the
  // round-robin pointer advances on booking. See resolveAutoRoutedAssignment
  // in _worker.js.
  let isAutoRouted = false;

  // ── Prefill from the website's contact form ──
  // When someone submits the Name/Email/Company name/Description form on
  // revitalproductions.com, that form's success action redirects here
  // with the same values as URL query params (see the Framer setup notes
  // - the site itself is untouched, only what happens after submit
  // changes). If they arrive that way, skip asking for the same info
  // again and go straight to resolving who they're assigned to.
  const qp = new URLSearchParams(window.location.search);
  const prefill = {
    name: (qp.get("name") || "").trim(),
    email: (qp.get("email") || "").trim(),
    company: (qp.get("company") || "").trim(),
    notes: (qp.get("notes") || qp.get("description") || "").trim()
  };
  const isPrefilled = !!(prefill.name && prefill.email);

  // ── Client Portal -> "book your account manager" flow ──
  // The client portal links here with ?amEmail=<their assigned AM's
  // email> instead of a personId - that email is verified server-side
  // (has to actually be assigned as a real client's account manager in
  // Client Portal Manager, see findAccountManagerByEmail in _worker.js)
  // rather than trusted blindly. When present, there's only ever one
  // right answer for a given client - no routing needed.
  const clientAmEmail = (qp.get("amEmail") || "").trim();

  // ── Direct link to a specific person, bypassing routing ──
  // Kept for cases like a promoted "book with Jane directly" link
  // somewhere - most visitors never hit this, routing decides for them.
  const directPersonId = (qp.get("personId") || "").trim();

  function fmtDayLabel(dateKey) {
    // dateKey is "YYYY-MM-DD" in the business timezone; render weekday/date
    // labels using the visitor's own local calendar day derived from noon
    // UTC on that date, which avoids an off-by-one on either side of the
    // date line while still reading naturally.
    const d = new Date(dateKey + "T12:00:00Z");
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function fmtTime(iso) {
    return new Date(iso).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }

  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str || "";
    return d.innerHTML;
  }

  function init() {
    el("loadMsg").classList.add("hidden");

    if (isPrefilled) {
      contact = { name: prefill.name, email: prefill.email, company: prefill.company, notes: prefill.notes };
      el("pageTitle").textContent = "Pick a Time for Your Call";
      el("pageSubtitle").textContent = `Thanks, ${prefill.name.split(" ")[0]} — just pick a time that works for you and we'll send the calendar invite.`;
      resolveAndLoadAvailability();
      return;
    }

    // Not prefilled - show the contact form first (skipped entirely for
    // prefilled visitors above). This applies whether it's a first-touch
    // prospect or a client-portal (?amEmail=) visitor who hasn't already
    // filled out a form elsewhere - both need name/email either way.
    el("formStep").classList.remove("hidden");
  }

  el("continueBtn").addEventListener("click", () => {
    const name = el("fName").value.trim();
    const email = el("fEmail").value.trim();
    const company = el("fCompany").value.trim();
    const notes = el("fNotes").value.trim();
    const msgEl = el("formMsg");
    msgEl.classList.add("hidden");

    if (!name || !email) {
      msgEl.textContent = "Please enter your name and email.";
      msgEl.classList.remove("hidden");
      return;
    }

    contact = { name, email, company, notes };
    el("formStep").classList.add("hidden");
    resolveAndLoadAvailability();
  });

  el("backToFormBtn").addEventListener("click", () => {
    el("timeStep").classList.add("hidden");
    el("formStep").classList.remove("hidden");
  });

  // Resolves who this booking is with (client-portal amEmail, a direct
  // ?personId= link, or - the default path almost everyone takes -
  // notes-based auto-routing on the backend) and loads their availability
  // in one call. See the auto-routing comment on handleBookingAvailability
  // in _worker.js for how "who" gets decided server-side.
  async function resolveAndLoadAvailability() {
    el("timeStep").classList.remove("hidden");
    el("assignmentBanner").classList.add("hidden");
    el("slotConfirmRow").classList.add("hidden");
    el("timeMsg").textContent = "Finding a time...";
    el("dayList").innerHTML = "";
    el("slotList").innerHTML = "";

    isAutoRouted = !clientAmEmail && !directPersonId;

    try {
      const qs = clientAmEmail
        ? "amEmail=" + encodeURIComponent(clientAmEmail)
        : directPersonId
          ? "personId=" + encodeURIComponent(directPersonId)
          : "notes=" + encodeURIComponent(contact.notes);
      const res = await fetch("/api/booking/availability?" + qs);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to load availability");
      availability = data;
      assignedPerson = {
        id: data.assignedPersonId || directPersonId || null,
        amEmail: clientAmEmail || null,
        name: data.personName,
        title: data.personTitle || ""
      };

      el("assignmentBanner").classList.remove("hidden");
      el("assignmentBanner").innerHTML =
        `<span>You'll be talking with <strong>${escapeHtml(assignedPerson.name)}</strong>${assignedPerson.title ? " &middot; " + escapeHtml(assignedPerson.title) : ""}</span>`;
    } catch (e) {
      el("timeMsg").textContent = "Couldn't load availability: " + e.message;
      return;
    }

    const days = Object.keys(availability.slotsByDay).sort();
    if (days.length === 0) {
      el("timeMsg").textContent = "No open times in the next couple weeks — please reach out directly.";
      return;
    }
    el("timeMsg").textContent = "";

    const dayList = el("dayList");
    days.forEach((dateKey, i) => {
      const btn = document.createElement("button");
      btn.className = "pill-btn";
      btn.textContent = fmtDayLabel(dateKey);
      btn.addEventListener("click", () => selectDay(dateKey, btn));
      dayList.appendChild(btn);
      if (i === 0) selectDay(dateKey, btn);
    });
  }

  function selectDay(dateKey, btnEl) {
    selectedDay = dateKey;
    document.querySelectorAll("#dayList .pill-btn").forEach((b) => b.classList.remove("selected"));
    btnEl.classList.add("selected");
    el("slotConfirmRow").classList.add("hidden");

    const slotList = el("slotList");
    slotList.innerHTML = "";
    (availability.slotsByDay[dateKey] || []).forEach((iso) => {
      const btn = document.createElement("button");
      btn.className = "slot-btn";
      btn.textContent = fmtTime(iso);
      btn.addEventListener("click", () => selectSlot(iso, btn));
      slotList.appendChild(btn);
    });
  }

  function selectSlot(iso, btnEl) {
    selectedSlotISO = iso;
    document.querySelectorAll("#slotList .slot-btn").forEach((b) => b.classList.remove("selected"));
    btnEl.classList.add("selected");
    el("slotConfirmRow").classList.remove("hidden");
    el("selectedSlotBanner").innerHTML =
      `<span>${escapeHtml(fmtDayLabel(selectedDay))} at ${escapeHtml(fmtTime(iso))} with ${escapeHtml(assignedPerson.name)}</span>`;
  }

  el("confirmBtn").addEventListener("click", async () => {
    const msgEl = el("confirmMsg");
    msgEl.classList.add("hidden");

    const btn = el("confirmBtn");
    btn.disabled = true;
    btn.textContent = "Booking...";

    try {
      const targetField = assignedPerson.amEmail
        ? { amEmail: assignedPerson.amEmail }
        : { personId: assignedPerson.id };
      const res = await fetch("/api/booking/book", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ...targetField,
          startISO: selectedSlotISO,
          name: contact.name,
          email: contact.email,
          company: contact.company,
          notes: contact.notes,
          autoRouted: isAutoRouted
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Booking failed");

      el("timeStep").classList.add("hidden");
      el("confirmStep").classList.remove("hidden");
      el("confirmText").textContent =
        `You're confirmed with ${assignedPerson.name} on ${fmtDayLabel(selectedDay)} at ${fmtTime(selectedSlotISO)}. A calendar invite is on its way to ${contact.email}.`;
    } catch (e) {
      // 409 = someone else took the slot in the meantime - reload
      // availability for the same assigned person instead of leaving them
      // stuck on a dead slot.
      msgEl.textContent = e.message;
      msgEl.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "BOOK 15 MIN CALL";
      if (String(e.message).toLowerCase().includes("booked by someone else")) {
        setTimeout(() => {
          el("slotConfirmRow").classList.add("hidden");
          resolveAndLoadAvailability();
        }, 1500);
      }
    }
  });

  init();
})();
</script>
</body>
</html>
