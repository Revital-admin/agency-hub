<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Calendar</title>
<link rel="stylesheet" href="../style.css?v=2">
<link rel="stylesheet" href="css/style.css?v=1">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
<div class="bg-grid"></div>

<main class="container container-wide">
<div class="brand-bar">
<div class="brand-logo-container"></div>
</div>

<header class="site-header">
<div class="header-eyebrow">
<span class="dot"></span>
<span>Internal Operations</span>
</div>
<h1 class="site-title">Booking <em>Calendar</em></h1>
<p class="site-subtitle">Who's booked on what this week, and who has room for more — a live view of Team Roster's weekly capacity, one week at a time.</p>
</header>

<div class="step-card tracker-controls">
<div class="tracker-controls-row">
<button type="button" id="prevWeekBtn" class="btn btn-secondary">&larr; Prev</button>
<span id="weekLabel" class="week-label">Week of —</span>
<button type="button" id="nextWeekBtn" class="btn btn-secondary">Next &rarr;</button>
<button type="button" id="thisWeekBtn" class="btn btn-secondary">This Week</button>
<span style="flex:1;"></span>
<button type="button" id="newBookingBtn" class="btn-primary">+ New Booking</button>
</div>
</div>

<div class="step-card table-card" id="gridCard">
<div class="tracker-table-wrap">
<table class="tracker-table booking-grid" id="bookingGrid">
<thead>
<tr id="gridHeaderRow"></tr>
</thead>
<tbody id="gridBody"></tbody>
</table>
<p id="emptyState" class="empty-state" style="display:none;">No team members on the roster yet — add people in Team Roster &amp; Capacity first.</p>
</div>
</div>

<!-- New/Edit Booking form - a modal-ish inline card rather than a real
     modal, consistent with how the rest of the Hub avoids modal
     libraries. See js/app.js openBookingForm/closeBookingForm. -->
<div class="step-card" id="bookingFormCard" style="display:none;">
<h2 id="bookingFormTitle" style="font-family:var(--font-heading); color:var(--color-accent); font-size:1.1rem; margin:0 0 12px;">New Booking</h2>
<div class="form-grid">
<div class="form-group">
<label for="bookingMember">Team Member</label>
<input type="text" id="bookingMember" list="bookingMemberOptions" placeholder="Who's this for?">
<datalist id="bookingMemberOptions"></datalist>
</div>
<div class="form-group">
<label for="bookingClient">Client</label>
<input type="text" id="bookingClient" list="bookingClientOptions" placeholder="Which client?">
<datalist id="bookingClientOptions"></datalist>
</div>
<div class="form-group">
<label for="bookingStart">Start Date</label>
<input type="date" id="bookingStart">
</div>
<div class="form-group">
<label for="bookingEnd">End Date</label>
<input type="date" id="bookingEnd">
</div>
<div class="form-group">
<label for="bookingHours">Hours / Week</label>
<input type="number" id="bookingHours" min="0" step="0.5" placeholder="e.g. 15">
</div>
</div>
<div class="form-group">
<label for="bookingNotes">Notes</label>
<input type="text" id="bookingNotes" placeholder="Optional">
</div>
<div class="form-actions" style="display:flex; gap:10px; margin-top:10px;">
<button type="button" id="saveBookingBtn" class="btn-primary">Save Booking</button>
<button type="button" id="deleteBookingBtn" class="btn btn-secondary" style="display:none; color:#ef4444;">Delete</button>
<button type="button" id="cancelBookingBtn" class="btn btn-secondary">Cancel</button>
</div>
<p id="bookingFormStatus" class="form-status" style="margin-top:8px;"></p>
</div>

</main>
<script src="js/app.js?v=1"></script>
</body>
</html>
