<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout Canceled — Revital Productions</title>
<meta name="robots" content="noindex" />
<!--
  Standalone public page, same pattern as /billing-success/index.html -
  this is the cancel_url a Stripe Checkout Session redirects a client to
  if they back out before entering their card. Purely cosmetic, no
  billing status changed on our side (the Contract & Invoice Tracker
  record just stays at "Link Sent" until they complete checkout).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: "Azo Sans Uber Regular";
    src: url("https://framerusercontent.com/assets/61LYSu5ltMaZcADwTMqTvGekik.woff2") format("woff2");
    font-display: swap;
    font-style: normal;
    font-weight: 400;
  }
  :root {
    --primary: #f5805f;
    --secondary: #d85a30;
    --bg-main: #262626;
    --bg-card: #303030;
    --border-color: rgba(241, 234, 219, 0.12);
    --text-bright: #f1eadb;
    --text-muted: rgba(241, 234, 219, 0.55);
    --font-heading: "Azo Sans Uber Regular", "Inter", sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-main);
    color: var(--text-bright);
    font-family: var(--font-body);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 48px 20px;
  }
  .page { width: 100%; max-width: 520px; text-align: center; }
  .brand-logo { height: 28px; margin: 0 auto 28px auto; display: block; }
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 14px;
    padding: 40px 28px;
  }
  .icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(245, 128, 95, 0.12); color: var(--primary);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px auto; font-size: 26px;
  }
  h1 {
    font-family: var(--font-heading);
    font-weight: 400;
    font-size: 1.9rem;
    line-height: 1.2;
    margin: 0 0 12px 0;
  }
  p { color: var(--text-muted); margin: 0 0 8px 0; font-size: 0.98rem; line-height: 1.5; }
  .footer-note { margin-top: 28px; font-size: 0.82rem; color: var(--text-muted); }
</style>
</head>
<body>
<div class="page">
  <img class="brand-logo" src="https://framerusercontent.com/images/o3h6eIm6ccc2IJyWsP0aAbTp5M.png" alt="Revital Productions" />
  <div class="card">
    <div class="icon">&#10005;</div>
    <h1>Checkout canceled</h1>
    <p>No charge was made and no card was saved.</p>
    <p>If this wasn't intentional, just reach back out to your Revital Productions contact for a new billing link.</p>
  </div>
  <div class="footer-note">Revital Productions</div>
</div>
</body>
</html>
